<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corner Shop Reviews</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#1f1d1a;--muted:#6b665f;--line:#e6e1d9;--accent:#c2410c;--star:#f59e0b;--off:#d6d0c6}
@media (prefers-color-scheme:dark){:root{--bg:#17150f;--card:#221f18;--text:#f3efe8;--muted:#a39d92;--line:#363229;--accent:#fb923c;--off:#4a453a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 40px}h1{display:flex;align-items:center;gap:12px;margin:0;font-size:2.7rem;letter-spacing:-1px}.hero{padding-bottom:12px;margin-bottom:6px;border-bottom:4px solid;border-image:linear-gradient(90deg,#f97316,#ec4899,#8b5cf6) 1}.logo{font-size:2.4rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}.title{font-weight:800;background:linear-gradient(90deg,#f97316,#ec4899,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}.sub,.meta{color:var(--muted)}.meta{font-size:.85rem}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:16px 0}.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:inherit;font:inherit}
.card{cursor:pointer;text-align:left}.emoji{font-size:2.4rem}.name{font-weight:600}.stars{color:var(--star);letter-spacing:2px}.off{color:var(--off)}
.back{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0;margin-bottom:10px}
.rev{border-top:1px solid var(--line);padding:10px 0}form{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:10px}
input,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);width:100%}
.pick button{background:none;border:0;font-size:1.8rem;cursor:pointer;color:var(--off);padding:0 2px}.pick .on{color:var(--star)}
.go{background:var(--accent);color:#fff;border:0;padding:11px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}.err{color:#dc2626;min-height:1.2em}
.ok{color:#16a34a;font-weight:600;font-size:.9rem}.resolve,.bought{padding:4px 10px;margin-left:8px}
.cat{display:flex;align-items:baseline;gap:10px;margin:22px 0 4px;font-size:1.35rem}.cat::before{content:'';width:6px;height:1.2em;border-radius:3px;background:linear-gradient(#f97316,#ec4899);align-self:center}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:16px;overflow-x:auto;padding:14px 6px 20px}
.card{position:relative;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.card::before{content:'';position:absolute;top:0;left:-130%;width:60%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .6s ease;pointer-events:none}
.card:hover{transform:translateY(-8px) scale(1.04);border-color:var(--accent);box-shadow:0 16px 30px rgba(236,72,153,.25)}
.card:hover::before{left:140%}.emoji{display:inline-block;transition:transform .3s ease}.card:hover .emoji{transform:scale(1.3) rotate(-8deg)}
@media (prefers-reduced-motion:reduce){.card,.card::before,.emoji{transition:none}.card:hover,.card:hover .emoji{transform:none}}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:20px;width:min(340px,90vw)}dialog::backdrop{background:rgba(0,0,0,.5)}dialog form{border:0;margin:0;padding:0}
</style></head><body><div class="wrap">
<div class="hero"><h1><span class="logo">🛒</span><span class="title">Corner Shop Reviews</span></h1></div>
<div class="tabs" id="tabs"></div><div id="view"></div></div>
<script>
let items=[],cat="All",open=null,draft=0,pw=null,note="";
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML};
const stars=v=>'<span class="stars">'+[1,2,3,4,5].map(k=>k<=Math.round(v)?"★":'<span class="off">★</span>').join("")+"</span>";
async function load(){const r=await fetch("/api/items");items=await r.json();render()}
function render(){
 const cats=["All",...new Set(items.map(i=>i.category)),"Owner"];
 document.getElementById("tabs").innerHTML=cats.map(c=>`<button class="tab ${c===cat?"on":""}" data-c="${c}">${c==="Owner"?"🔒 Owner":c}</button>`).join("");
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cat=b.dataset.c;open=null;render()});
 const v=document.getElementById("view");
 if(cat==="Owner"){ownerView(v);return}
 if(open){const i=items.find(x=>x.id===open);
  v.innerHTML=`<div class="panel"><button class="back" id="back">← Back</button>
  <div class="emoji">${i.emoji}</div><div class="name">${esc(i.name)}</div><div class="meta">${i.category} · ₹${i.price} · ${esc(i.details)}</div>
  <button class="go" id="buy" ${i.stock<1?"disabled":""}>${i.stock<1?"Out of stock":"Reserve in Store ("+i.stock+" left)"}</button>
  <dialog id="dlg"><form id="rf"><strong>Reserve ${esc(i.name)}</strong><input id="rn" placeholder="Your name" required maxlength="30"><input id="rp" placeholder="Phone number (10 digits)" required pattern="[0-9]{10}" maxlength="10" inputmode="numeric"><div><button class="go">Confirm</button> <button type="button" id="cx">Cancel</button></div></form></dialog>
  ${note?`<div class="${note.startsWith("✅")?"ok":"err"}">${note}</div>`:""}
  <p>${stars(i.average)} <b>${i.reviews.length?i.average.toFixed(1):"–"}</b> <span class="meta">(${i.reviews.length} reviews)</span></p>
  ${i.reviews.length?i.reviews.map(r=>`<div class="rev"><b>${esc(r.author)}</b> ${stars(r.stars)} <span class="meta">${r.date}</span><div>${esc(r.text)}</div>${r.resolved?'<div class="ok">✅ Resolved — Thank you for bringing this to our attention.</div>':""}</div>`).join(""):'<p class="meta">No reviews yet.</p>'}
  <form id="f"><strong>Write a review</strong><div class="pick">${[1,2,3,4,5].map(k=>`<button type="button" data-k="${k}" class="${k<=draft?"on":""}">★</button>`).join("")}</div>
  <input id="u" placeholder="Your name" maxlength="30"><textarea id="t" rows="3" placeholder="What did you think?" maxlength="300"></textarea>
  <div class="err" id="err"></div><button class="go">Submit review</button></form></div>`;
  document.getElementById("back").onclick=()=>{note="";open=null;render()};
  document.getElementById("buy").onclick=()=>document.getElementById("dlg").showModal();
  document.getElementById("cx").onclick=()=>document.getElementById("dlg").close();
  document.getElementById("rf").onsubmit=async e=>{e.preventDefault();const r=await fetch(`/api/items/${i.id}/reserve`,{method:"POST",body:new URLSearchParams({name:document.getElementById("rn").value.trim(),phone:document.getElementById("rp").value})});note=r.ok?"✅ Reserved! Please visit the store and buy within 24 hours.":((await r.json()).error||"Could not reserve");await load()};
  document.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>{draft=+b.dataset.k;const u=document.getElementById("u").value,t=document.getElementById("t").value;render();document.getElementById("u").value=u;document.getElementById("t").value=t});
  document.getElementById("f").onsubmit=async e=>{e.preventDefault();
   const body=new URLSearchParams({author:document.getElementById("u").value.trim(),stars:draft,text:document.getElementById("t").value.trim()});
   const r=await fetch(`/api/items/${i.id}/reviews`,{method:"POST",body});
   if(!r.ok){document.getElementById("err").textContent=(await r.json()).error||"Could not save review";return}
   draft=0;await load()};
 }else v.innerHTML=cats.filter(c=>c!=="All"&&c!=="Owner"&&(cat==="All"||c===cat)).map(c=>{const list=items.filter(x=>x.category===c);return `<h2 class="cat">${c} <span class="meta">${list.length} items</span></h2><div class="row">`+list.map(x=>`<button class="card" data-id="${x.id}"><div class="emoji">${x.emoji}</div><div class="name">${esc(x.name)}</div>${stars(x.average)}<div class="meta">${x.reviews.length?x.average.toFixed(1)+" · "+x.reviews.length+" reviews":"No reviews yet"}</div><div><b>₹${x.price}</b></div></button>`).join("")+"</div>"}).join(""),
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>{note="";open=+b.dataset.id;draft=0;render()});
}
async function ownerView(v){
 if(!pw){  // not logged in: show the login form
  v.innerHTML=`<div class="panel"><strong>🔒 Owner login</strong><form id="lf"><input id="pw" type="password" placeholder="Password"><div class="err" id="err"></div><button class="go">Login</button></form></div>`;
  document.getElementById("lf").onsubmit=async e=>{e.preventDefault();
   const p=document.getElementById("pw").value.trim();
   const r=await fetch("/api/owner/login",{method:"POST",body:new URLSearchParams({password:p})});
   if(!r.ok){document.getElementById("err").textContent=r.status===401?"Wrong password":"Server error ("+r.status+"). Rebuild and restart the C++ server.";return}
   pw=p;render()};
  return}
 const d=await (await fetch("/api/owner/report",{headers:{"X-Password":pw}})).json();
 const total=d.reduce((a,x)=>a+x.revenue,0);
 const issues=d.flatMap(x=>x.issues.map(r=>({...r,item:x.name,itemId:x.id})));
 const holds=d.flatMap(x=>x.reservations.map(r=>({...r,item:x.name,itemId:x.id})));
 v.innerHTML=`<div class="panel"><strong>Sales report</strong> <button class="back" id="out">Logout</button>
  <p class="meta">Total revenue: ₹${total}</p>
  ${d.map(x=>`<div class="rev">${x.emoji} <b>${esc(x.name)}</b> · sold ${x.sold} · ₹${x.revenue} · stock ${x.stock}</div>`).join("")}</div>
  <div class="panel"><strong>📦 Reservations</strong> <span class="meta">(held for 24 hours)</span>
  ${holds.map(r=>`<div class="rev"><b>${esc(r.item)}</b> · ${esc(r.name)} · ${esc(r.phone)} · ${r.hoursLeft}h left <button class="go bought" data-i="${r.itemId}" data-r="${r.id}">Mark as bought</button></div>`).join("")||'<p class="meta">No reservations.</p>'}</div>
  <div class="panel"><strong>🛠 Customer issues</strong>
  ${issues.map(r=>`<div class="rev"><b>${esc(r.item)}</b> · ${esc(r.author)}: ${esc(r.text)} <button class="go resolve" data-i="${r.itemId}" data-r="${r.id}">Resolve</button></div>`).join("")||'<p class="meta">No open issues.</p>'}</div>
  <div class="panel"><strong>⚠️ Restock needed</strong>
  ${d.filter(x=>x.restock).map(x=>`<div class="rev">${x.emoji} ${esc(x.name)}: only ${x.stock} left</div>`).join("")||'<p class="meta">All items are well stocked.</p>'}</div>`;
 document.getElementById("out").onclick=()=>{pw=null;render()};
 document.querySelectorAll(".resolve").forEach(b=>b.onclick=async()=>{await fetch("/api/owner/resolve",{method:"POST",headers:{"X-Password":pw},body:new URLSearchParams({item:b.dataset.i,review:b.dataset.r})});await load()});
 document.querySelectorAll(".bought").forEach(b=>b.onclick=async()=>{await fetch("/api/owner/bought",{method:"POST",headers:{"X-Password":pw},body:new URLSearchParams({item:b.dataset.i,reservation:b.dataset.r})});await load()})}
load();
</script></body></html>
